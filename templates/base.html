<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Academic Manager{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">🎓 Academic Manager</div>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('subjects') }}">Subjects</a>
    <a href="{{ url_for('attendance') }}">Attendance</a>
    <a href="{{ url_for('assignments') }}">Assignments</a>
    <a href="{{ url_for('marks') }}">Marks</a>
  </nav>
</header>
<main>
{% with messages = get_flashed_messages() %}
{% if messages %}
  {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Student Productivity & Academic Management System</footer>
</body>
</html>
